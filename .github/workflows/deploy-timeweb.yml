name: Publish to Timeweb

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: timeweb-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && vars.TIMEWEB_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TIMEWEB_HOST: vh460.timeweb.ru
      TIMEWEB_USER: alekseyaa3
      SITE_MODE: ${{ vars.TIMEWEB_SITE_MODE }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check UTM generator
        run: |
          node tests/utm-utils.test.mjs
          node tests/utm-page.test.mjs
          python3 tests/site-package.test.py
      - name: Prepare public files
        shell: bash
        run: |
          set -euo pipefail
          case "$SITE_MODE" in
            ''|preview) python3 scripts/package-site.py --output "$RUNNER_TEMP/site" ;;
            production) python3 scripts/package-site.py --output "$RUNNER_TEMP/site" --production ;;
            *) echo "Unsupported site mode" >&2; exit 1 ;;
          esac
      - name: Upload with restricted SSH key
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.TIMEWEB_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          umask 077
          mkdir -p "$RUNNER_TEMP/timeweb-ssh"
          key_file="$RUNNER_TEMP/timeweb-ssh/key"
          hosts_file="$RUNNER_TEMP/timeweb-ssh/known_hosts"
          trap 'rm -f "$key_file" "$hosts_file"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          unset DEPLOY_KEY
          printf '%s\n' 'vh460.timeweb.ru ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMZgp4mt0IQjn2ep1FFT3Sp37tK9HItDovo+bpEvjtGA' > "$hosts_file"
          # Destination is relative to the public_html directory enforced by rrsync.
          # Do not use --delete: unrelated server files must remain untouched.
          rsync -rpt --delay-updates --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r \
            -e "ssh -i $key_file -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o UserKnownHostsFile=$hosts_file -o ConnectTimeout=15" \
            "$RUNNER_TEMP/site/" "$TIMEWEB_USER@$TIMEWEB_HOST:./"
